<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>ZenithGateway · 真实滚动替换</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111919;color:#eef1e7;font:16px system-ui,"Microsoft YaHei",sans-serif}main{max-width:1180px;margin:auto;padding:34px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #394440;padding-bottom:20px}small{color:#a9b5ad}h1{font-size:30px;margin:22px 0 6px}h2{font-size:24px;font-weight:500;margin:10px 0}b{font-weight:600}.pill{border:1px solid #607143;color:#cdf28f;border-radius:5px;padding:7px 12px}.diagram{display:grid;grid-template-columns:1fr 70px 1fr 70px 1.3fr;align-items:center;margin:30px 0}.box{border:1px solid #45534d;padding:22px 16px;border-radius:8px;background:#1c2825}.line{height:2px;background:#bcf06e}.nodes{display:grid;gap:12px}.node{display:flex;justify-content:space-between;align-items:center}.weight{font:36px ui-monospace,monospace;color:#c7f37d}.dim{opacity:.55}.workspace{background:#f3f1e5;color:#192620;padding:22px 28px;border-radius:9px;margin-top:28px;min-height:242px}.row{display:grid;grid-template-columns:90px 1fr;gap:14px;border-bottom:1px solid #d5dacc;padding:10px 0}.row time{color:#687367;font:14px ui-monospace,monospace}.status{color:#c7f37d;min-height:32px}footer{margin-top:20px;color:#9aaca2;font-size:14px}.metrics{display:flex;gap:30px;margin-top:18px}.metrics strong{font:28px ui-monospace,monospace}.metrics small{display:block;margin-top:5px}
</style><main><header><b>ZENITH / GATEWAY</b><span class="pill">真实隔离实验 · HAProxy 单入口</span></header><h1>双实例滚动替换</h1><small>50 req/s 短窗口 · 后台版本追平 · 阶段判定 · 有界退出</small><div class="diagram"><div class="box"><small>唯一业务入口</small><h2>请求发生器</h2><small>不选择实例 / 不自动重试</small></div><div class="line"></div><div class="box"><small>外部负载均衡</small><h2>HAProxy</h2><small>真实权重与摘除命令</small></div><div class="line"></div><div class="nodes"><div class="box node" id="a"><span>实例 A<small style="display:block">旧实例</small></span><span class="weight" id="wa">—</span></div><div class="box node" id="b"><span>实例 B<small style="display:block">新实例</small></span><span class="weight" id="wb">—</span></div></div></div><div class="status" id="current">等待实际事件…</div><div class="metrics"><div><strong id="in">—</strong><small>最近窗口入口完成</small></div><div><strong id="up">—</strong><small>上游接收</small></div><div><strong id="audit">—</strong><small>审计确认</small></div><div><strong id="latency">—</strong><small>P99 / ms</small></div></div><div class="workspace"><b>实际操作记录</b><div id="events"></div></div><footer>数值来自本轮执行结果。权重是调度配置；不等于瞬时请求比例。短测不证明一小时容量。</footer></main>
<script>
async function tick(){try{const list=await(await fetch('/state',{cache:'no-store'})).json(),last=list.at(-1);if(!last)return;document.querySelector('#current').textContent=last.title;for(const k of ['a','b']){document.querySelector('#w'+k).textContent=last.weights[k]+'%';document.querySelector('#'+k).classList.toggle('dim',last.weights[k]===0)}const measured=[...list].reverse().find(x=>x.finished!==undefined);if(measured)for(const [id,key] of Object.entries({in:'finished',up:'upstream',audit:'audit',latency:'p99'}))document.getElementById(id).textContent=key==='p99'?measured[key].toFixed(1):measured[key];const box=document.querySelector('#events');box.replaceChildren();for(const e of list.slice(-5).reverse()){const row=document.createElement('div');row.className='row';const t=document.createElement('time'),s=document.createElement('span');t.textContent=e.at.substring(11,19)+'Z';s.textContent=e.title;row.append(t,s);box.append(row)}}catch(e){document.querySelector('#current').textContent='观测暂不可用：'+e.message}}
tick();setInterval(tick,350)
</script></html>
