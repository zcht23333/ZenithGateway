{
  "rule_files": [
    "alerts.yml"
  ],
  "evaluation_interval": "5s",
  "tests": [
    {
      "name": "forward Redis fault respects 15 seconds and does not fire opposite action",
      "interval": "5s",
      "input_series": [
        {
          "series": "up{job=\"zenith-gateway\",instance=\"A\"}",
          "values": "1+0x60"
        },
        {
          "series": "zenith_ratelimit_decisions_total{job=\"zenith-gateway\",instance=\"A\",event=\"redis_unconfirmed\",action=\"forward\",execution=\"not_sent\"}",
          "values": "0+1x24"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "15s",
          "alertname": "ZenithRateLimitFailOpen",
          "exp_alerts": []
        },
        {
          "eval_time": "20s",
          "alertname": "ZenithRateLimitFailOpen",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "zenith-gateway",
                "instance": "A",
                "severity": "warning",
                "event": "redis_unconfirmed"
              },
              "exp_annotations": {
                "summary": "Rate limiter admitted requests without confirmed quota",
                "description": "A: redis_unconfirmed caused fail-open decisions in the last minute. Forward is a limiter action, not proof of upstream receipt or HTTP success. Check final outcomes and limiter diagnostics."
              }
            }
          ]
        },
        {
          "eval_time": "1m",
          "alertname": "ZenithRateLimitProtectiveRejection",
          "exp_alerts": []
        },
        {
          "eval_time": "1m",
          "alertname": "ZenithRateLimitDebitUncertain",
          "exp_alerts": []
        },
        {
          "eval_time": "1m",
          "alertname": "ZenithRateLimitMetricsMissing",
          "exp_alerts": []
        }
      ]
    },
